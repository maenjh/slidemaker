<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Slidemaker - 방송 스크립트 → PPTX</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --navy: #1B2A4A;
      --teal: #0D9488;
      --coral: #F87171;
      --bg: #F8FAFC;
      --white: #FFFFFF;
      --gray-100: #F1F5F9;
      --gray-200: #E2E8F0;
      --gray-400: #94A3B8;
      --gray-600: #475569;
      --gray-800: #1E293B;
    }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--gray-800); min-height: 100vh; }
    header { background: var(--navy); color: var(--white); padding: 2rem; text-align: center; }
    header h1 { font-size: 1.75rem; font-weight: 700; }
    .subtitle { margin-top: 0.5rem; color: var(--gray-400); font-size: 0.95rem; }
    main { max-width: 640px; margin: 0 auto; padding: 2rem 1rem; }

    .upload-section {
      background: var(--white);
      border-radius: 12px;
      padding: 2rem;
      border: 1px solid var(--gray-200);
    }
    .file-label {
      display: flex; flex-direction: column; align-items: center; gap: 0.75rem;
      padding: 2.5rem; border: 2px dashed var(--gray-200); border-radius: 8px;
      cursor: pointer; transition: border-color 0.2s, background 0.2s;
    }
    .file-label:hover { border-color: var(--teal); background: var(--gray-100); }
    .file-icon { font-size: 2.5rem; }
    .file-text { color: var(--gray-600); font-size: 0.95rem; }
    .file-name { margin-top: 0.75rem; font-size: 0.9rem; color: var(--teal); font-weight: 600; text-align: center; min-height: 1.4em; }

    #submitBtn {
      display: block; width: 100%; margin-top: 1rem; padding: 0.85rem;
      background: var(--navy); color: var(--white); border: none; border-radius: 8px;
      font-size: 1rem; font-weight: 600; cursor: pointer; transition: background 0.2s, opacity 0.2s;
    }
    #submitBtn:hover:not(:disabled) { background: #152238; }
    #submitBtn:disabled { opacity: 0.4; cursor: not-allowed; }

    .loading { text-align: center; padding: 3rem 1rem; }
    .spinner {
      width: 40px; height: 40px; border: 3px solid var(--gray-200); border-top-color: var(--teal);
      border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 1rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading p { color: var(--gray-600); font-size: 0.95rem; }

    .steps { margin-top: 1rem; text-align: left; }
    .step { padding: 0.5rem 0; font-size: 0.9rem; color: var(--gray-400); display: flex; align-items: center; gap: 0.5rem; }
    .step.active { color: var(--teal); font-weight: 600; }
    .step.done { color: var(--gray-600); }
    .step-icon { width: 20px; text-align: center; }

    .error {
      background: #FEF2F2; border: 1px solid var(--coral); color: #991B1B;
      border-radius: 8px; padding: 1rem 1.25rem; margin-top: 1.5rem; font-size: 0.9rem;
    }
    .result {
      text-align: center; padding: 2rem; margin-top: 1.5rem;
      background: #ECFDF5; border: 1px solid var(--teal); border-radius: 12px;
    }
    .result-icon { font-size: 2.5rem; margin-bottom: 0.5rem; }
    .result p { font-size: 1.1rem; font-weight: 600; color: #065F46; margin-bottom: 1rem; }
    .btn-edit {
      display: inline-block; padding: 0.6rem 1.5rem; background: var(--teal); color: var(--white);
      border-radius: 8px; text-decoration: none; font-weight: 600; font-size: 0.95rem; transition: background 0.2s;
    }
    .btn-edit:hover { background: #0B8276; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <header>
    <h1>Slidemaker</h1>
    <p class="subtitle">방송 스크립트를 업로드하면 PPTX 프레젠테이션을 자동 생성합니다</p>
  </header>

  <main>
    <section class="upload-section">
      <form id="uploadForm">
        <label class="file-label" id="fileLabel">
          <span class="file-icon">&#128196;</span>
          <span class="file-text">방송 스크립트 파일을 선택하세요 (.docx, .txt, .md)</span>
          <input type="file" id="fileInput" name="script" accept=".docx,.txt,.md" hidden>
        </label>
        <div id="fileName" class="file-name"></div>
        <button type="submit" id="submitBtn" disabled>PPTX 생성</button>
      </form>
    </section>

    <div id="loading" class="loading hidden">
      <div class="spinner"></div>
      <p>프레젠테이션을 생성하고 있습니다...</p>
      <div class="steps">
        <div class="step" id="step1"><span class="step-icon">&#9723;</span> Claude로 스크립트 분석 중</div>
        <div class="step" id="step2"><span class="step-icon">&#9723;</span> 슬라이드 마크다운 변환 중</div>
        <div class="step" id="step3"><span class="step-icon">&#9723;</span> PPTX 생성 중</div>
      </div>
    </div>

    <div id="error" class="error hidden"></div>

    <div id="result" class="result hidden">
      <div class="result-icon">&#9989;</div>
      <p>PPTX 생성 완료!</p>
      <a id="editLink" href="#" target="_blank" class="btn-edit">슬라이드 편집하기</a>
    </div>
  </main>

  <script>
    const fileInput = document.getElementById('fileInput');
    const fileName = document.getElementById('fileName');
    const submitBtn = document.getElementById('submitBtn');
    const uploadForm = document.getElementById('uploadForm');
    const loading = document.getElementById('loading');
    const errorDiv = document.getElementById('error');
    const resultDiv = document.getElementById('result');
    const editLink = document.getElementById('editLink');
    const steps = [document.getElementById('step1'), document.getElementById('step2'), document.getElementById('step3')];

    fileInput.addEventListener('change', () => {
      if (fileInput.files.length > 0) {
        fileName.textContent = fileInput.files[0].name;
        submitBtn.disabled = false;
      } else {
        fileName.textContent = '';
        submitBtn.disabled = true;
      }
    });

    function setStep(index) {
      steps.forEach((s, i) => {
        if (i < index) {
          s.className = 'step done';
          s.querySelector('.step-icon').innerHTML = '&#9745;';
        } else if (i === index) {
          s.className = 'step active';
          s.querySelector('.step-icon').innerHTML = '&#9654;';
        } else {
          s.className = 'step';
          s.querySelector('.step-icon').innerHTML = '&#9723;';
        }
      });
    }

    uploadForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!fileInput.files.length) return;

      errorDiv.classList.add('hidden');
      resultDiv.classList.add('hidden');
      loading.classList.remove('hidden');
      submitBtn.disabled = true;
      setStep(0);

      const formData = new FormData();
      formData.append('script', fileInput.files[0]);

      // Simulate step progress
      const stepTimer1 = setTimeout(() => setStep(1), 5000);
      const stepTimer2 = setTimeout(() => setStep(2), 10000);

      try {
        const res = await fetch('/api/generate-pptx', {
          method: 'POST',
          body: formData,
        });

        clearTimeout(stepTimer1);
        clearTimeout(stepTimer2);

        const data = await res.json();
        if (!res.ok) throw new Error(data.error || '서버 오류가 발생했습니다.');

        steps.forEach(s => {
          s.className = 'step done';
          s.querySelector('.step-icon').innerHTML = '&#9745;';
        });

        editLink.href = data.editUrl;
        resultDiv.classList.remove('hidden');
      } catch (err) {
        errorDiv.textContent = err.message;
        errorDiv.classList.remove('hidden');
      } finally {
        loading.classList.add('hidden');
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
